[package]
name = "send_with_us"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Endoze <endoze@endozemedia.com>"]
description = "Async Rust client for the SendWithUs transactional email API"
license = "MIT"
repository = "https://github.com/endoze/send_with_us"
keywords = ["email", "transactional", "sendwithus", "api", "client"]
categories = ["api-bindings", "email", "asynchronous"]
# Repo tooling isn't part of the crate; keeping it out means CI-only changes
# don't count as package changes and trigger a release.
exclude = [
  ".github/",
  ".coderabbit.yaml",
  ".gitignore",
  "deny.toml",
  "dist-workspace.toml",
  "release-plz.toml",
  "rustfmt.toml",
  "tarpaulin.toml",
]

[lib]
name = "send_with_us"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.23"
url = "2.5"
async-trait = "0.1"
tokio = { version = "1.53", features = ["rt", "fs"] }
tracing = { version = "0.1", optional = true }

[features]
default = []
logging = ["tracing"]

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
tempfile = "3"
mockito = "1.7.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
